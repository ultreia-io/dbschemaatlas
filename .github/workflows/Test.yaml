name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to test
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git branch, tag, or commit to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2.13.0
        with:
          r-version: release
          use-public-rspm: true

      - name: Install coverage dependencies
        uses: r-lib/actions/setup-r-dependencies@v2.13.0
        with:
          extra-packages: |
            any::covr
            any::DT
            any::htmltools
            any::xml2
            local::.
          needs: coverage

      - name: Generate coverage reports
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(
              normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"),
              "package"
            )
          )

          print(coverage)
          covr::to_cobertura(coverage, filename = "coverage.xml")
          covr::report(coverage, file = "coverage.html", browse = FALSE)

      - name: Store coverage reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.html
            coverage.xml

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: ultreia-io/dbschemaatlas
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
