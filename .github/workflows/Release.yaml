name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2.13.0
        with:
          r-version: release
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2.13.0

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2.13.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Validate release metadata
        id: package
        shell: bash
        run: |
          package=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1L, "Package"])')
          version=$(Rscript -e 'cat(read.dcf("DESCRIPTION")[1L, "Version"])')
          tag="${GITHUB_REF_NAME}"
          expected_tag="v${version}"
          archive="${package}_${version}.tar.gz"

          if [[ "${package}" != "dbschemaatlas" ]]; then
            echo "::error::Expected package name dbschemaatlas, but found ${package}."
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must have the form x.y.z, but found ${version}."
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Releases must be triggered by a version tag."
            exit 1
          fi

          if [[ "${tag}" != "${expected_tag}" ]]; then
            echo "::error::Tag ${tag} does not match package version ${version}; expected ${expected_tag}."
            exit 1
          fi

          if ! grep -Fq "# ${package} ${version}" NEWS.md; then
            echo "::error::NEWS.md must contain a '# ${package} ${version}' heading."
            exit 1
          fi

          tag_commit=$(git rev-list -n 1 "refs/tags/${tag}")
          head_commit=$(git rev-parse HEAD)

          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Checked-out commit ${head_commit} does not match ${tag} (${tag_commit})."
            exit 1
          fi

          git fetch --no-tags origin main

          if ! git merge-base --is-ancestor "${tag_commit}" "refs/remotes/origin/main"; then
            echo "::error::Tag ${tag} does not point to a commit on main."
            exit 1
          fi

          echo "package=${package}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Build release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          R CMD build --no-manual .

          if [[ ! -f "${ARCHIVE}" ]]; then
            echo "::error::Expected release archive ${ARCHIVE} was not created."
            exit 1
          fi

          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Check release archive
        shell: Rscript {0}
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          _R_CHECK_CRAN_INCOMING_: "FALSE"
          _R_CHECK_CRAN_INCOMING_REMOTE_: "FALSE"
        run: |
          rcmdcheck::rcmdcheck(
            path = Sys.getenv("ARCHIVE"),
            args = c("--no-manual", "--as-cran"),
            error_on = "note",
            check_dir = file.path(tempdir(), "check")
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "${TAG}" \
            "${ARCHIVE}" \
            "${ARCHIVE}.sha256" \
            --verify-tag \
            --title "dbschemaatlas ${VERSION}" \
            --generate-notes
